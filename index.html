earch"><input id="search" aria-label="Buscar películas" placeholder="Busca tu próxima historia…" type="search"></div><a id="headerlogin" href="#acceso">Iniciar sesión</a><button class="menu" aria-label="Abrir menú" aria-expanded="false">☰</button></header><aside><nav aria-label="Principal"><button class="nav active" data-page="inicio">⌂ <span>Inicio</span></button><button class="nav" data-page="tendencias">↗ <span>Tendencias</span></button><button class="nav" data-page="categorias">▦ <span>Categorías</span></button><button class="nav" data-page="lista">♡ <span>Mi lista</span></button></nav><div class="sidefoot"><b>Pequeñas briznas.<br>Grandes historias.</b><br>Universo de cine inventado.<br>Demo creativa · sin cuentas</div></aside><main id="main"></main><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script><script>const titles=[['El faro de las nubes','Animación','Una aprendiz de farera descubre que las nubes perdidas necesitan una luz para regresar a casa.','Bruma Estudio',98,'#337fa1','#f7c575'],['Última curva en Órbita','Acción','Una mensajera compite por los anillos de un planeta para devolver una semilla antes del amanecer.','Taller Meteoro',112,'#6456ad','#ffb279'],['La oficina de los jueves','Comedia','Cinco vecinos alquilan una oficina para fingir que trabajan, hasta que llega su primer cliente.','Risa de Papel',94,'#bf7353','#f5d681'],['Donde duermen los ecos','Terror','Una restauradora escucha desde las paredes conversaciones que todavía no han sucedido.','Sombra Mansa',106,'#254f59','#9be0ba'],['Un verano de bolsillo','Romance','Dos coleccionistas de postales reconstruyen un verano que ninguno recuerda haber compartido.','Estudio Marea',101,'#af617c','#ffc89c'],['El jardín del segundo sol','Ciencia ficción','En una estación sin noche, una botánica cultiva la primera sombra y cambia el destino de su colonia.','Órbita Suave',124,'#495aa1','#8ee5c9'],['La isla de los botones','Aventura','Un cartógrafo diminuto cruza un archipiélago que cambia de forma cada vez que alguien se abrocha un abrigo.','Bruma Estudio',103,'#25847a','#f5d69a'],['La orquesta de barro','Animación','Una vasija desafinada reúne a los juguetes olvidados para salvar el taller donde nacieron.','Taller Luciérnaga',88,'#b17649','#ebca9c'],['Manual para perder un tren','Comedia','Una puntualísima revisora y un relojero sin reloj intentan llegar tarde por primera vez.','Risa de Papel',96,'#5a879c','#f3ce7f'],['El kilómetro invisible','Acción','Una ciclista encuentra una carretera fuera de todos los mapas y una ciudad que necesita su ayuda.','Taller Meteoro',109,'#a76050','#ffdc91'],['Cartas bajo la lluvia azul','Romance','Una cartero y un fabricante de paraguas intercambian cartas que solo pueden leerse bajo la lluvia.','Estudio Marea',107,'#5468a4','#edb9c9'],['La casa del último huésped','Terror','En una posada vacía, cada habitación conserva un minuto de la vida de su visitante anterior.','Sombra Mansa',99,'#394b6a','#baacde'],['Archivo de mareas futuras','Ciencia ficción','Una archivista recibe recuerdos del océano del año siguiente y debe decidir cuáles conservar.','Órbita Suave',118,'#287d8c','#b6dec5'],['El mapa de las migas','Aventura','Dos hermanos siguen un camino de pan que se eleva hacia una ciudad suspendida entre árboles.','Taller Luciérnaga',92,'#6c8660','#ffdc9d'],['La costurera del viento','Drama','Una modista cose cometas para un pueblo que ha olvidado cómo despedirse.','Lino Cine',105,'#96729e','#f7c5a6']];const films=titles.map((a,i)=>({id:i,title:a[0],genre:a[1],syn:a[2],studio:a[3],duration:a[4],a:a[5],b:a[6],views:21+i*17}));const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let saved=[],liked=[];try{saved=JSON.parse(localStorage.getItem('brizna-list')||'[]');liked=JSON.parse(localStorage.getItem('brizna-likes')||'[]');if(!Array.isArray(saved))saved=[];if(!Array.isArray(liked))liked=[]}catch{}function store(){try{localStorage.setItem('brizna-list',JSON.stringify(saved));localStorage.setItem('brizna-likes',JSON.stringify(liked))}catch{}}let page='inicio',cat='Todas',query='',cleanup=()=>{};const main=document.querySelector('main'),search=document.querySelector('#search');function art(f){const c=document.createElement('canvas');c.width=800;c.height=450;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,800,450);g.addColorStop(0,f.a);g.addColorStop(1,'#142b40');x.fillStyle=g;x.fillRect(0,0,800,450);let rand=n=>{let v=Math.sin(f.id*93+n*71+9)*43758;return v-Math.floor(v)};for(let j=0;j<34;j++){x.fillStyle='#ffffff40';x.beginPath();x.arc(rand(j)*800,rand(j+40)*300,rand(j+60)*3+1,0,7);x.fill()}x.fillStyle=f.b;x.beginPath();x.arc(610,132,74,0,7);x.fill();for(let j=0;j<5;j++){x.fillStyle=j%2?f.a:'#173947';x.beginPath();x.moveTo(j*220-100,450);x.lineTo(j*220+80,180+rand(j+8)*150);x.lineTo(j*220+300,450);x.fill()}x.save();x.translate(460,280);x.rotate((f.id%3-1)*.12);x.shadowColor='#071c4680';x.shadowBlur=15;x.shadowOffsetY=14;x.fillStyle=f.b;x.beginPath();x.roundRect(-60,-85,120,146,36);x.fill();x.shadowBlur=0;x.shadowOffsetY=0;x.fillStyle='#163644';x.beginPath();x.arc(-21,-28,7,0,7);x.arc(21,-28,7,0,7);x.fill();x.strokeStyle='#163644';x.lineWidth=5;x.beginPath();x.arc(0,-6,17,.1,3.04);x.stroke();x.restore();x.fillStyle='#f8edd9';x.font='700 14px system-ui';x.fillText('C I N E B R I Z N A  /  '+f.genre.toUpperCase(),35,40);x.font='800 30px system-ui';let words=f.title.split(' '),line='',y=360;words.forEach(w=>{if(x.measureText(line+w).width>360){x.fillText(line,35,y);line='';y+=37}line+=w+' '});x.fillText(line,35,y);return c.toDataURL()}films.forEach(f=>f.img=art(f));function card(f){return `<article class="card"><button class="poster" data-film="${f.id}" aria-label="Ver ${f.title}"><img src="${f.img}" alt="Ilustración original de ${f.title}"><span class="duration">${f.duration} min</span></button><h3>${f.title}</h3><p>${f.studio} · ${f.genre}</p><p>${Math.round(f.views*1000).toLocaleString('es')} vistas · Película ficticia</p><button class="save ${saved.includes(f.id)?'on':''}" data-save="${f.id}" aria-label="${saved.includes(f.id)?'Quitar de':'Guardar en'} Mi lista: ${f.title}" aria-pressed="${saved.includes(f.id)}">${saved.includes(f.id)?'♥':'♡'}</button></article>`}function bind(){main.querySelectorAll('[data-film]').forEach(e=>e.onclick=()=>location.hash='pelicula/'+e.dataset.film);main.querySelectorAll('[data-save]').forEach(e=>e.onclick=()=>{let id=+e.dataset.save;saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];store();render(false)})}function render(scroll=true){cleanup();cleanup=()=>{};const hash=decodeURIComponent(location.hash.slice(1)||'inicio');if(hash.startsWith('pelicula/')){let f=films.find(f=>f.id===+hash.split('/')[1]);if(f){watch(f);if(scroll)window.scrollTo(0,0);return}}page=['inicio','tendencias','categorias','lista'].includes(hash)?hash:'inicio';document.querySelectorAll('.nav').forEach(e=>{e.classList.toggle('active',e.dataset.page===page);e.setAttribute('aria-current',e.dataset.page===page?'page':'false')});const hero=page==='inicio'&&!query;main.innerHTML=`${hero?`<section class="hero"><div class="herotext"><span class="eyebrow">UN UNIVERSO POR DESCUBRIR</span><h1>Historias con<br><em>otra dimensión.</em></h1><p>Sal de lo de siempre. Entra en un mundo de películas hechas de pura imaginación.</p><button class="solid" data-film="0">Descubrir una historia ↗</button></div><div id="stage" aria-label="Escena 3D interactiva de una cámara de cine. Arrastra para girar."><div class="fallback">🎥</div><small>UN PEQUEÑO SET, UNA GRAN IDEA · ARRASTRA PARA GIRAR</small></div></section>`:''}<div class="toolbar" aria-label="Filtrar por género">${['Todas',...new Set(films.map(f=>f.genre))].map(g=>`<button class="chip ${cat===g?'active':''}" aria-pressed="${cat===g}" data-cat="${g}">${g}</button>`).join('')}</div><div class="heading"><h2>${query?'Resultados de búsqueda':{inicio:'Tu próxima gran historia',tendencias:'Historias que están subiendo',categorias:'Explor
